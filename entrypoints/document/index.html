<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Reader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="header">
      <img src="/icon.svg" alt="" width="28" height="28" />
      <h1>Tiny Reader</h1>
      <span id="name"></span>
      <button type="button" id="open">Open a PDF…</button>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden />
      <button type="button" id="start" disabled>Read from the start</button>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">
        Open a PDF, or drop one anywhere on this page. It is read on this computer; nothing is uploaded.
      </p>
      <article id="document"></article>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
