<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>Tiny Reader settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form id="form"></form>
    <section>
      <h2>Shortcuts</h2>
      <dl>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></dt>
        <dd>Read the selected text</dd>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd></dt>
        <dd>Pause or resume</dd>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd></dt>
        <dd>Stop</dd>
      </dl>
      <p>
        Change these, or add keys for next and previous sentence, in Firefox under Add-ons and themes, the gear
        menu, Manage Extension Shortcuts.
      </p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
