<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>Tiny Reader settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form id="form">
      <label for="voice">Voice</label>
      <select id="voice" name="voice"></select>

      <label for="speed">Speed</label>
      <input id="speed" name="speed" type="range" step="0.05" list="speed-marks" />
      <output for="speed"></output>
      <datalist id="speed-marks"><option value="1"></option></datalist>

      <label for="pitchShift">Pitch</label>
      <input id="pitchShift" name="pitchShift" type="range" min="-6" max="6" step="0.5" list="zero" />
      <output for="pitchShift"></output>
      <datalist id="zero"><option value="0"></option></datalist>

      <label for="pitchRange">Expressiveness</label>
      <input id="pitchRange" name="pitchRange" type="range" step="0.05" list="one" />
      <output for="pitchRange"></output>
      <datalist id="one"><option value="1"></option></datalist>

      <label for="prefetch">Sentences prepared ahead</label>
      <input id="prefetch" name="prefetch" type="number" step="1" />
      <span class="hint" id="prefetch-hint">More gives smoother playback and uses more memory.</span>

      <div class="row">
        <button type="button" id="reset">Reset to defaults</button>
        <span id="saved" role="status" aria-live="polite"></span>
      </div>
    </form>
    <section>
      <h2>Shortcuts</h2>
      <dl>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></dt>
        <dd>Read the selected text</dd>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd></dt>
        <dd>Pause or resume</dd>
        <dt><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd></dt>
        <dd>Stop</dd>
      </dl>
      <p>
        Change these, or add keys for next and previous sentence, in Firefox under Add-ons and themes, the gear
        menu, Manage Extension Shortcuts.
      </p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
