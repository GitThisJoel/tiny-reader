<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Reader engine test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Tiny Reader engine test</h1>
      <form id="form">
        <label for="text">Text to speak</label>
        <textarea id="text" rows="5" required>Hello! This is tiny voca.</textarea>
        <div class="row">
          <label>Voice <select id="voice"></select></label>
          <label>Speed <input id="speed" type="number" min="0.5" max="2" step="0.1" value="1" /></label>
          <button type="submit">Speak</button>
          <button type="button" id="stop">Stop</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">Idle.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
