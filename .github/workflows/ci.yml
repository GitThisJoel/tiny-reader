name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned revisions and hashes live in the two scripts and in the list of models (whose
      # downloadable ones the smoke tests fetch), so their hash is the cache key.
      - uses: actions/cache@v6
        with:
          path: |
            public/assets
            vendor
            .cache/models
          key: assets-${{ hashFiles('scripts/fetch-assets.ts', 'scripts/build-espeak.sh', 'scripts/espeak.sha256', 'engine/models.ts') }}
      # Always runs: on a cache hit it only re-verifies the SHA-256 of every file.
      - run: pnpm fetch-assets
      # eSpeak NG as wasm, built from source in a container: about a minute, only when the cache
      # does not hold exactly the recorded build. The build itself fails if it comes out different.
      - run: sha256sum --check --quiet scripts/espeak.sha256 || pnpm build-espeak
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:parity
      - run: pnpm test:smoke
      - run: pnpm build
      - run: pnpm lint:ext
      - run: pnpm zip
      - uses: actions/upload-artifact@v7
        with:
          name: tiny-reader-firefox
          path: .output/*.zip
          # .output is a dot-directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
